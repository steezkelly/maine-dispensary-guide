name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

permissions:
  contents: read
  deployments: read
  pull-requests: read
  statuses: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The continuation suite includes a browser-level regression contract.
      # Keep this in the required build job so a preview-smoke skip cannot
      # silently turn that contract into source-only coverage.
      - name: Install Chromium for ICA continuation guardrails
        run: npx playwright install chromium --with-deps

      - name: Test image pipeline hero variants
        run: npm run test:image-pipeline

      - name: Test image audit responsive variants
        run: node --test scripts/image/tests/image-audit.test.cjs

      - name: Test GSC daily analytics contract
        run: |
          node --test apps/maine-cannabis/scripts/seo/gsc-search-analytics-daily.test.cjs
          node --test apps/maine-cannabis/scripts/seo/gsc-misroute-audit.test.cjs

      - name: Test ICA continuation guardrails
        run: npm run test:continuation

      - name: Test market-stats video no-autoplay contract
        run: npm run test:market-stats-video

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Verify built ICA continuation output
        run: npm run test:continuation:built

      # Asserts the build is pure static (no SSR function bundle).
      # The previous check asserted the OPPOSITE shape (functions/_render.func/.vc-config.json
      # MUST exist) — that was correct when /api/lead-capture and /api/indexnow-key were SSR
      # routes, but both endpoints were retired 2026-07-06 (commits bb2b864f + 48a0459d) and the
      # site is now pure output:'static'. The old check fired a CI-main failure on every push
      # since 2026-07-06 (8 in a row). Replaced with the inverse assertion: if a functions/
      # directory exists, that means an SSR route was added without an SSR-function-bundle
      # check being re-added — fail and flag it. This is the new expected shape.
      - name: Assert pure-static build (no SSR functions emitted)
        run: |
          if [ -d apps/maine-cannabis/.vercel/output/functions ]; then
            echo "::error::Unexpected SSR function bundle at apps/maine-cannabis/.vercel/output/functions/"
            echo "The site is configured as output:'static' and should not emit a serverless function."
            echo "If a new SSR route was added intentionally, re-enable the SSR-function-bundle assertion"
            echo "(see .github/workflows/ci.yml for the previous version) and update AGENTS.md."
            ls -la apps/maine-cannabis/.vercel/output/functions/
            exit 1
          fi

      # Regenerate autoRelatedData.json after the Astro project is built so
      # the AutoRelated component picks up any new guides added since the
      # last regen. The script is cheap (parses frontmatter only, no network)
      # and exits non-zero if the data file is stale — the build step then
      # fails the CI run instead of silently shipping stale related-content
      # data. Added 2026-07-05 alongside the check:compressed-frontmatter
      # gate that catches the R128 bug class.
      - name: Regenerate autoRelatedData.json
        run: |
          npm --workspace @network/maine-cannabis run data:auto-related

      - name: Validate sitemap XML encoding
        run: |
          npm --workspace @network/maine-cannabis run check:sitemap-xml -- ../../dist/sitemap-0.xml

      # Sprint 80 wiring: add the cheap content-quality checks to CI so they
      # actually run. Previously they were only run by hand at sprint close
      # (per the senior review's Section 6 "operational debt" finding).
      # Each check exits non-zero on failure, which fails the build.
      - name: Check for malformed hrefs
        run: npm --workspace @network/maine-cannabis run check:hrefs

      # The standalone check:content-health always exits non-zero on any
      # tree with baseline issues (which is the project's current state,
      # by design — those are the known/accepted failures captured in
      # .content-health-baseline.json). The actual CI gate is the
      # regression detector below, which compares current against the
      # baseline and exits 0 only when they match. `|| true` keeps the
      # standalone informational (output preserved) without blocking.
      - name: Check content health (14 invariants, informational)
        if: success()  # only run if build succeeded
        run: |
          npm --workspace @network/maine-cannabis run check:content-health || true

      - name: Check content health regression (no new failures vs baseline)
        run: |
          npm --workspace @network/maine-cannabis run check:content-health:regression

      - name: Test content-health regression baseline contract
        run: |
          node scripts/check/check-content-health-regression.test.cjs

      - name: Test content-health source and rendered-reference contracts
        run: |
          node --test scripts/check/check-content-health.test.cjs
          node --test scripts/check/lib/rendered-image-refs.test.cjs
          node --test scripts/check/corrections-log-latest-date.test.cjs
          node --test scripts/check/ocp-testing-legal-content.test.cjs
          npm run test:home-grow-legal-content

      - name: Test pre-push diagnostic filtering contract
        run: |
          node scripts/git/tests/pre-push-verify-diagnostics.test.cjs

      - name: Check build warnings (post-build CSS/HTML warnings)
        run: |
          npm --workspace @network/maine-cannabis run check:build-warnings

      # Sprint 80 wiring: the sitemap postprocessor unit + integration test.
      # Catches the "dead-code cascade" failure mode (e.g. a const removal
      # collapsing the sitemap from 222 URLs to 7) and the "noindex check
      # broke" collapse (force-everything-noindex drops to 0 URLs). Both
      # silent in build/CI otherwise — the build goes green and the live
      # site is broken until a human notices. See
      # apps/maine-cannabis/scripts/build/sitemap-postprocess.test.mjs.
      - name: Check sitemap postprocessor (unit + integration)
        run: |
          npm --workspace @network/maine-cannabis run check:sitemap-postprocess

      # Sprint 80 wiring: catch the "docs claim 6 checks but CI runs 3"
      # class. The senior review flagged that the docs claimed 6 checks
      # but CI was only running 3 of them — drift went uncaught for at
      # least one sprint. This lint scans AGENTS.md, MDG_AGENT_HANDBOOK.md,
      # PROJECT_STATE.md, and the senior review for "check:X runs" claims
      # and asserts each X is wired in CI or the pre-push gate.
      - name: Check docs-vs-code (no docs/code drift in verify surface)
        run: |
          npm --workspace @network/maine-cannabis run check:docs-vs-code

      # Inreach pass 2026-07-05: lint that catches the R128 bug class
      # (2026-07-04) — files using <AutoRelated /> without the
      # `import AutoRelated` statement inside their frontmatter block.
      # Astro's bundler only resolves imports inside the frontmatter,
      # and the broken state silently produces an empty <aside> with
      # no related-guide items. Cheap (no Astro invocation, no build,
      # no network) and cwd-independent.
      - name: Check compressed-frontmatter (R128 bug class)
        run: |
          npm --workspace @network/maine-cannabis run check:compressed-frontmatter

  deploy-preview:
    name: Deploy Preview
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Skip duplicate Vercel CLI preview deploy
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "VERCEL_TOKEN is not configured; skipping duplicate Vercel CLI preview deploy."
          echo "The Vercel GitHub App deployment/check handles preview deployments for this repo."

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel

      - name: Pull Vercel project settings
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --environment=preview --yes

      - name: Build project artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --environment=preview

      - name: Validate sitemap XML encoding (Vercel build output)
        if: env.VERCEL_TOKEN != ''
        run: |
          node ./scripts/check/sitemap-xml.cjs .vercel/output/static/sitemap-0.xml

      - name: Deploy to Vercel (Preview)
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: vercel deploy --prebuilt --environment=preview --yes

      - name: Comment on PR with preview URL
        if: env.VERCEL_TOKEN != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Preview Deployment ready for review\n:white_check_mark: Build passed\n:link: https://project-1-git-${{ github.event.pull_request.head.ref }}-steezkellys-projects.vercel.app`
            })

  smoke-test-preview:
    name: Smoke Tests (Preview)
    needs: deploy-preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Resolve Vercel preview URL
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="$(node scripts/check/resolve-preview-url.cjs)"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Resolved preview URL: $url"

      - name: Check preview access
        run: |
          set -euo pipefail
          status="$(curl -L -sS -o /tmp/preview.html -w '%{http_code}' "$PREVIEW_URL" || true)"
          if [ "$status" = "401" ] || [ "$status" = "403" ] || grep -qi '<title>Login .* Vercel</title>\|Provider.*accounts list is empty' /tmp/preview.html; then
            echo "SKIP_PREVIEW_SMOKE=true" >> "$GITHUB_ENV"
            echo "Preview is protected by Vercel login/SSO; skipping browser smoke tests for preview deployment."
            exit 0
          fi
          echo "SKIP_PREVIEW_SMOKE=false" >> "$GITHUB_ENV"

      - name: Run smoke tests against preview
        if: env.SKIP_PREVIEW_SMOKE != 'true'
        run: npx playwright test

  deploy-production:
    name: Deploy Production
    needs: smoke-test-production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Skip duplicate Vercel CLI production deploy
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "VERCEL_TOKEN is not configured; skipping duplicate Vercel CLI production deploy."
          echo "The Vercel GitHub App deployment/check handles production deployments for this repo."

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel

      - name: Pull Vercel project settings
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --environment=production --yes

      - name: Build project artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --environment=production

      - name: Validate sitemap XML encoding (Vercel build output)
        if: env.VERCEL_TOKEN != ''
        run: |
          node ./scripts/check/sitemap-xml.cjs .vercel/output/static/sitemap-0.xml

      - name: Deploy to Vercel (Production)
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --environment=production --yes --prod

  smoke-test-production:
    name: Smoke Tests (Production)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests against production
        run: npx playwright test
        env:
          PREVIEW_URL: https://mainedispensaryguide.com

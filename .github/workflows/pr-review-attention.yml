name: PR review attention

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: '17 14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pr-review-attention-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  request-review:
    name: Request review attention
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.fork == false
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Post one owner review request
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-review-attention:opening -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const alreadyPinged = comments.some((comment) => comment.body.includes(marker));
            if (alreadyPinged) {
              core.info(`PR #${issue_number} already has an opening review request.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `${marker}\n\n@steezkelly — **review requested.** Codex Cloud is configured to review this PR automatically. Please add a review or an explicit disposition after the checks are green so this PR does not remain unattended.`,
            });

  remind-unreviewed:
    name: Remind on unreviewed pull requests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Remind once after 48 hours without a submitted review
        uses: actions/github-script@v7
        with:
          script: |
            const openingMarker = '<!-- pr-review-attention:opening -->';
            const reminderMarker = '<!-- pr-review-attention:reminder -->';
            const reviewAgeMs = 48 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;
            const now = Date.now();
            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const pr of pullRequests) {
              if (pr.draft) continue;
              if (now - new Date(pr.created_at).getTime() < reviewAgeMs) continue;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const hasSubmittedReview = reviews.some((review) => (
                review.commit_id === pr.head.sha
                && (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED' || review.state === 'COMMENTED')
              ));
              if (hasSubmittedReview) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });
              const alreadyReminded = comments.some((comment) => comment.body.includes(reminderMarker));
              if (alreadyReminded) continue;

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `${reminderMarker}\n\n@steezkelly — **review reminder:** this non-draft PR has been open for at least 48 hours with no submitted review. CI state alone is not a disposition; please review, request changes, approve, close, or explain the next step.`,
              });

              const alreadyPinged = comments.some((comment) => comment.body.includes(openingMarker));
              if (!alreadyPinged) {
                core.info(`PR #${pr.number} was opened before this workflow existed; the reminder is its first review-attention comment.`);
              }
            }

<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 252" role="img" aria-labelledby="chart-title-maine-vs-national-pricing chart-caption-maine-vs-national-pricing"><title id="chart-title-maine-vs-national-pricing">Maine retail price vs national benchmarks, June 2026</title><desc id="chart-caption-maine-vs-national-pricing">Maine&apos;s OCP-weighted price ($6.62) is 26% below the $8.94 national single-gram average and 83% above the $3.62 national equivalized average — the gap reflects Maine&apos;s heavier weighting toward bulk-gram sales. Wholesale spot intentionally omitted; re-pulled quarterly per the national-context matrix §8.3.</desc><text x="16" y="39.400000000000006" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14">Maine (OCP 2025, all-pkg)</text><rect x="236" y="20" width="150.8" height="28" rx="2" fill="#1F4D3A"/><text x="604" y="39.400000000000006" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14" text-anchor="start">6.62</text><text x="16" y="83.4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14">U.S. national (single-gram pkg)</text><rect x="236" y="64" width="203.7" height="28" rx="2" fill="#B85C3A"/><text x="604" y="83.4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14" text-anchor="start">8.94</text><text x="16" y="127.4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14">U.S. national (all-pkg, equivalized)</text><rect x="236" y="108" width="82.5" height="28" rx="2" fill="#3D5A40"/><text x="604" y="127.4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14" text-anchor="start">3.62</text><text x="16" y="171.4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14">Michigan (cheapest, all-pkg)</text><rect x="236" y="152" width="86.6" height="28" rx="2" fill="#3D5A40"/><text x="604" y="171.4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14" text-anchor="start">3.8</text><text x="16" y="215.4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14">Illinois (most expensive, all-pkg)</text><rect x="236" y="196" width="360.0" height="28" rx="2" fill="#B85C3A"/><text x="604" y="215.4" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#0E1A14" text-anchor="start">15.8</text></svg>
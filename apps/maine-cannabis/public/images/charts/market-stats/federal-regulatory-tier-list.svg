<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 308" role="img" aria-labelledby="chart-title-federal-regulatory-tier-list chart-caption-federal-regulatory-tier-list"><title id="chart-title-federal-regulatory-tier-list">Federal cannabis regulatory status, three tiers (July 2026)</title><desc id="chart-caption-federal-regulatory-tier-list">The DEA ALJ hearing on the broader Schedule I → III rescheduling concluded Jul 15, 2026; post-hearing briefs due Aug 17, 2026; ALJ has no deadline; DEA Administrator final rule has no deadline.</desc><rect x="16" y="16" width="688" height="84" rx="6" fill="#1F4D3A"/><text x="32" y="42" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#F2F2E2">Schedule III</text><text x="32" y="62" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#F2F2E2" opacity="0.85">Effective Apr 22, 2026</text><text x="32" y="82" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#F2F2E2" opacity="0.9">FDA-approved marijuana products AND state-licensed medical cannabis (incl. Maine MMCP)</text><rect x="16" y="112" width="688" height="84" rx="6" fill="#8C5A3A"/><text x="32" y="138" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#F2F2E2">Schedule I</text><text x="32" y="158" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#F2F2E2" opacity="0.85">Unchanged at federal level</text><text x="32" y="178" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#F2F2E2" opacity="0.9">Adult-use (recreational) cannabis — all 24 legal states including Maine AUP</text><rect x="16" y="208" width="688" height="84" rx="6" fill="#B85C3A"/><text x="32" y="234" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#F2F2E2">Pending federal change</text><text x="32" y="254" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#F2F2E2" opacity="0.85">Nov 12, 2026 (contested by H.R. 7024 / H.R. 7010 / Senate delay bills)</text><text x="32" y="274" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#F2F2E2" opacity="0.9">Hemp / CBD / delta-8 THC products — switching to total-THC standard + 0.4 mg/container cap</text></svg>